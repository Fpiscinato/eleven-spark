name: Deploy to Cloudflare

# Every push to main publishes the new version to the Cloudflare Worker.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build, audit and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The audits are the gate: a broken question bank must never reach the child.
      - name: Audit the question bank
        run: npm run audit

      - name: Type-check and build
        run: npm run build

      # A missing secret must fail with an actionable message, not with a
      # cryptic wrangler error.
      - name: Check the Cloudflare credentials
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Actions secret(s):$missing"
            echo ""
            echo "Add them in Settings -> Secrets and variables -> Actions:"
            echo "  CLOUDFLARE_API_TOKEN  = a Cloudflare API token (Workers Scripts: Edit)"
            echo "  CLOUDFLARE_ACCOUNT_ID = the Cloudflare account ID"
            exit 1
          fi
          echo "Cloudflare credentials found."

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        run: |
          echo "### ElevenSpark deployed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "The app now shows this version in Settings → App version." >> "$GITHUB_STEP_SUMMARY"
